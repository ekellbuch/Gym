# Native symbolic APEX grader; generation agent is unnecessary for references.
config_paths:
  - benchmarks/apex_shortlist/config.yaml
  - resources_servers/labbench2_vlm/configs/judge_model_openai.yaml
math_with_judge_simple_agent: null
apex_shortlist_math_with_judge_simple_agent: null
# The native schema requires a model reference even when should_use_judge=false.
# Register the existing model server; symbolic verification makes no judge calls.
judge_base_url: https://inference-api.nvidia.com/v1
judge_model_name: openai/openai/gpt-5.6-luna
judge_api_key: ${oc.env:INFERENCE_API_KEY}
apex_shortlist_math_with_judge_resources_server:
  resources_servers:
    math_with_judge:
      judge_model_server:
        name: judge_model
