# OCR Reasoning: published reference reasoning, native two-stage mcore judge.
config_paths:
  - resources_servers/vlm_eval_kit/configs/vlm_eval_kit.yaml

ocr_reasoning_resources_server:
  _inherit_from: vlm_eval_kit_resources_server
  resources_servers:
    vlm_eval_kit:
      mcore_source_path: results/oracle-upstream/VLMEvalKitMcore-6962c8d06b2b7b26a74a73d6212c06562b63e1b7
      judge_model: openai/openai/gpt-4o-mini
      judge_api_key: ${oc.env:INFERENCE_API_KEY}

ocr_reasoning_simple_agent:
  _inherit_from: vlm_eval_kit_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: ocr_reasoning_resources_server
      datasets:
      - name: ocr_reasoning
        type: benchmark
        jsonl_fpath: benchmarks/ocr_reasoning/data/ocr_reasoning_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/ocr_reasoning/prepare.py
        num_repeats: 1
