      resources_server:
        name: ocrbench_v2_cn_benchmark_resources_server
      datasets:
      - name: ocrbench_v2_cn
        type: benchmark
        jsonl_fpath: benchmarks/ocrbench_v2/data/ocrbench_v2_cn_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/ocrbench_v2/prepare_cn.py
        num_repeats: 1
