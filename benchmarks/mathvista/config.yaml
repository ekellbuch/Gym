# MathVista_MINI official answers and scorer from VLMEvalKitMcore@6962c8d.
config_paths:
  - resources_servers/vlm_eval_kit/configs/vlm_eval_kit.yaml

mathvista_benchmark_resources_server:
  _inherit_from: vlm_eval_kit_resources_server
  resources_servers:
    vlm_eval_kit:
      mcore_source_path: results/oracle-upstream/VLMEvalKitMcore-6962c8d06b2b7b26a74a73d6212c06562b63e1b7
      # The pinned MathVista reference uses this judge after exact-match prefetch.
      judge_model: us/azure/openai/gpt-4o-mini

mathvista_benchmark_simple_agent:
  _inherit_from: vlm_eval_kit_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: mathvista_benchmark_resources_server
      datasets:
      - name: mathvista
        type: benchmark
        jsonl_fpath: benchmarks/mathvista/data/mathvista_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/mathvista/prepare.py
        num_repeats: 1
